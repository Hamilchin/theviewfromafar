<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <script data-goatcounter="https://theviewfromafar.goatcounter.com/count"
        async src="//gc.zgo.at/count.js"></script>

        <script>
        MathJax = {
            tex: { inlineMath: [['\\(', '\\)']], displayMath: [['\\[', '\\]']] }
        };
        </script>
        <script async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>

        <style>
        /* keep footnote superscripts from inflating line spacing */
        sup, sub { position: relative; vertical-align: baseline; line-height: 0; font-size: 0.75em; }
        sup { top: -0.5em; }
        sub { bottom: -0.25em; }
        </style>

        <title>{title}</title>
    </head>
    <body style="width: 600px; margin: 0 auto; text-align: left;">
        <pre>
        <h2>{title}</h2></pre>

        <br>

        {content}
        
        <br><br><br><br><br><br><br><br><br><br><br><br>
        
    </body>
</html>
